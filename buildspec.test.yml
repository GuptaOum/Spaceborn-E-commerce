version: 0.2

# Typecheck and integration tests. Postgres runs as a sibling container (the project has
# privilegedMode), which `test/testdb.ts` picks up through TEST_DB_HOST instead of starting its
# own embedded server.

env:
  variables:
    TEST_DB_HOST: 127.0.0.1
    TEST_DB_PORT: "5432"
    TEST_DB_USER: spaceborn
    TEST_DB_PASSWORD: spaceborn

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.12
    commands:
      - set -e
      # pgvector is required: migrations run `create extension vector`, which plain postgres:16 lacks.
      - docker run -d --name testpg -p 5432:5432
        -e POSTGRES_USER=$TEST_DB_USER -e POSTGRES_PASSWORD=$TEST_DB_PASSWORD -e POSTGRES_DB=postgres
        pgvector/pgvector:pg16
      - for i in $(seq 1 40); do docker exec testpg pg_isready -U $TEST_DB_USER -q && break; sleep 2; done
      - docker exec testpg pg_isready -U $TEST_DB_USER

  pre_build:
    commands:
      - set -e
      - node --version
      - npm ci

  build:
    commands:
      - set -e
      - npm run typecheck
      - npm test
      # Python services: locked runtime dependencies plus the test tools.
      - python3 -m venv /tmp/copilot && /tmp/copilot/bin/pip install -q -r services/copilot/requirements.lock pytest pytest-asyncio respx
      - (cd services/copilot && /tmp/copilot/bin/python -m pytest -q)
      - python3 -m venv /tmp/cad && /tmp/cad/bin/pip install -q -r services/cad-worker/requirements.lock pytest
      - (cd services/cad-worker && /tmp/cad/bin/python -m pytest -q)
