name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # One install at the workspace root resolves @spaceborn/web-core for every app.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: API unit + integration tests
        run: npm test -w services/api

      - name: Build all apps and the API
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
